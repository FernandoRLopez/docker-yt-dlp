services:
  yt-dlp-api:
    build: 
      context: .
      dockerfile: app/Dockerfile
    container_name: youtube-dlp
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
    volumes:
       - ./downloads/songs:/app/downloads/songs
       - ./downloads/playlists:/app/downloads/playlists
       - ./downloads/videos:/app/downloads/videos

    restart: unless-stopped


